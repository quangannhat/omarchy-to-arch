# Standalone launcher styling derived from Omarchy's restrained default look.

font=monospace:size=12
terminal=ghostty
prompt="  "
icons-enabled=yes
show-actions=yes
match-mode=fuzzy
lines=12
width=45
horizontal-pad=24
vertical-pad=16
inner-pad=8
line-height=28
layer=overlay

[colors]
background=1a1a1aee
text=ffffffff
match=00ff99ff
selection=333333ff
selection-text=ffffffff
selection-match=00ff99ff
border=33ccffff

[border]
width=2
radius=0
