background {
    monitor =
    path = screenshot
    color = rgba(1a1a1aee)
    blur_passes = 2
    blur_size = 4
}

input-field {
    monitor =
    size = 320, 56
    outline_thickness = 2
    dots_size = 0.25
    dots_spacing = 0.25
    dots_center = true
    outer_color = rgba(33ccffff)
    inner_color = rgba(333333aa)
    font_color = rgba(ffffffff)
    fade_on_empty = false
    placeholder_text = <i>Input password...</i>
    hide_input = false
    rounding = 0
    position = 0, -80
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:1000] echo "$(date +'%H:%M')"
    color = rgba(ffffffff)
    font_size = 64
    font_family = monospace
    position = 0, 100
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] echo "$(date +'%A, %B %d')"
    color = rgba(00ff99ff)
    font_size = 18
    font_family = monospace
    position = 0, 25
    halign = center
    valign = center
}
